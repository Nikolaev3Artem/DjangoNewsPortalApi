name: check

on: push

jobs:
  run-pre-commit:
    runs-on: ubuntu-latest
    steps:
      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      
      - name: Install dependencies and run pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort
          isort --check-only .
          black --check .
          flake8 .